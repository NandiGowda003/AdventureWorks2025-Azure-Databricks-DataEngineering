name: CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  validate:
    name: Validate AdventureWorks Project
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate repository structure
        run: |
          echo "Checking project directories..."

          test -d dataset
          test -d factory
          test -d integrationRuntime
          test -d linkedService
          test -d pipeline
          test -d trigger
          test -d databricks
          test -d sql
          test -d api
          test -d powerbi
          test -d docs

          echo "All required directories exist."

      - name: Validate required files
        run: |
          echo "Checking required files..."

          test -f README.md
          test -f sql/metadata/ETL_Metadata.sql
          test -f api/frankfurter/README.md
          test -f powerbi/README.md

          echo "All required files exist."

      - name: Validate Databricks structure
        run: |
          test -d databricks/notebooks
          test -d databricks/jobs

          echo "Databricks structure validated."

      - name: CI validation successful
        run: |
          echo "AdventureWorks project CI validation passed successfully."
